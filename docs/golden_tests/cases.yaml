tests:
  - name: "Successful Routing"
    condition: "Valid request, multiple healthy keys available."
    expected: "Selects lowest priority index, increments RPM, returns 200."
  
  - name: "Circuit Breaker Trip on 429"
    condition: "Upstream returns 429 Rate Limit."
    expected: "Key marked RateLimited, 60s cooldown started, transparently retries next best key."

  - name: "Total Provider Exhaustion"
    condition: "All Gemini keys are RateLimited or Exhausted."
    expected: "Cross-provider failover to Groq if model compatibility allows, else 503."

  - name: "Daily Quota Ceiling"
    condition: "All keys hit their RPD limit."
    expected: "System safely rejects request with 429 (Proxy level) without invoking upstream."

  - name: "Auth Rejection"
    condition: "Invalid or missing Bearer token."
    expected: "401 Unauthorized immediately, no key pool lock acquired."
