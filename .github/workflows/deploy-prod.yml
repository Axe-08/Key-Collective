name: Production Deployment & Zero-Downtime Verification

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']

jobs:
  gate-and-deploy:
    name: 🛡️ Production Quality Gate & Rollout
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd ui && npm ci

      - name: Verify Strict Quality Gate (make gate)
        run: make gate

      - name: Build Production UI Assets
        run: cd ui && npm run build

      - name: Apply D1 Database Migrations (Prod)
        run: npx wrangler d1 migrations apply key-collective-d1 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker & Assets
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(npx wrangler deploy)
          echo "$DEPLOY_OUTPUT"
          VERSION_ID=$(echo "$DEPLOY_OUTPUT" | grep -o 'Version ID: [a-f0-9-]*' | cut -d ' ' -f 3)
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge Cloudflare Edge Cache
        run: |
          echo "Purging Cloudflare Edge Cache for zone 183e79ca7afcf160ef2eb4ff8bf733b5..."
          PURGE_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/183e79ca7afcf160ef2eb4ff8bf733b5/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything": true}')
          echo "Purge response: $PURGE_RESP"

      - name: Post-Deploy Canary Health Verification
        run: |
          sleep 4
          HEALTH=$(curl -s -f -m 10 https://key-col.axe08.tech/health)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"healthy"'

      - name: Verify Live Web Dashboard HTML & Assets
        run: |
          curl -s -L -f -m 10 -H "Accept: text/html" https://key-col.axe08.tech/ | grep -q "<title>Key Collective"
          HTML=$(curl -s -f -m 10 -H "Accept: text/html" https://console.key-col.axe08.tech/)
          echo "$HTML" | grep -q "<title>Key Collective"
          JS_FILE=$(echo "$HTML" | grep -o 'src="/assets/[^"]*"' | cut -d'"' -f2)
          echo "Discovered live JS asset: $JS_FILE"
          curl -sI -f -m 10 "https://console.key-col.axe08.tech$JS_FILE" | grep -q "200"

      - name: Verify Live Chat Completion Proxy
        if: ${{ env.KC_CANARY_TOKEN != '' }}
        env:
          KC_CANARY_TOKEN: ${{ secrets.KC_CANARY_TOKEN }}
        run: |
          curl -s -f -m 15 -X POST https://key-col.axe08.tech/v1/chat/completions \
            -H "Authorization: Bearer $KC_CANARY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"model": "gemini-2.5-flash", "messages": [{"role": "user", "content": "ping"}], "max_tokens": 5}' | grep -q '"choices"'
